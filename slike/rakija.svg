<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="slivovka" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9c172"/>
      <stop offset=".45" stop-color="#ece6a6"/>
      <stop offset="1" stop-color="#b8ad5c"/>
    </linearGradient>
    <linearGradient id="steklo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#eaf6ff" stop-opacity=".25"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".5"/>
    </linearGradient>
    <radialGradient id="sliva" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#8c9bd6"/>
      <stop offset=".55" stop-color="#4a5596"/>
      <stop offset="1" stop-color="#262c5c"/>
    </radialGradient>
  </defs>
  <!-- senca -->
  <ellipse cx="120" cy="226" rx="88" ry="12" fill="#000" opacity=".18"/>
  <!-- štamprl: nizek, rahlo širši zgoraj, debelo dno -->
  <g stroke="#3d4a55" stroke-width="5" stroke-linejoin="round">
    <path d="M50 86 L170 86 L162 214 C162 224 58 224 58 214 Z" fill="url(#steklo)"/>
  </g>
  <!-- šljivovka skoraj do roba -->
  <path d="M54 104 L166 104 L160 194 L60 194 Z" fill="url(#slivovka)"/>
  <ellipse cx="110" cy="104" rx="56" ry="9" fill="#f6f1c4" stroke="#b8ad5c" stroke-width="2.5"/>
  <!-- debelo stekleno dno -->
  <path d="M60 194 L160 194 L162 214 C162 224 58 224 58 214 Z" fill="#dff1fb" opacity=".85"/>
  <path d="M60 194 L160 194" stroke="#a9c3cf" stroke-width="2.5"/>
  <!-- rob kozarca -->
  <ellipse cx="110" cy="86" rx="60" ry="10" fill="none" stroke="#3d4a55" stroke-width="5"/>
  <ellipse cx="110" cy="86" rx="54" ry="7" fill="none" stroke="#fff" stroke-width="2" opacity=".8"/>
  <!-- lesk -->
  <path d="M66 98 L72 204" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".85"/>
  <path d="M150 102 L147 140" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".6"/>
  <!-- sliva z listom -->
  <g stroke="#1b1f45" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M194 134 C224 128 248 152 244 184 C240 214 210 228 186 218 C162 208 160 142 194 134 Z" fill="url(#sliva)"/>
    <path d="M206 136 C208 124 212 114 220 106" fill="none" stroke="#5b3a1e"/>
    <path d="M220 106 C232 90 252 92 254 100 C244 116 228 118 220 106 Z" fill="#6cbf4a" stroke="#2f6b25"/>
  </g>
  <path d="M206 146 C198 164 198 186 206 202" fill="none" stroke="#1b1f45" stroke-width="3" opacity=".45"/>
  <ellipse cx="200" cy="158" rx="9" ry="14" fill="#fff" opacity=".28" transform="rotate(-20 200 158)"/>
</svg>
