<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b1055">
<title>Dorin Kraš</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Nunito:wght@700;800;900&display=swap">
<link rel="stylesheet" href="css/stil.css?v=15">
</head>
<body data-zaslon="vstop">
  <div class="sky" id="sky"></div>

  <!-- Vstopni zaslon -->
  <section class="zaslon aktiven" id="zaslon-vstop">
    <main class="card">
      <div class="logo">
        <div class="candy c0"></div>
        <div class="candy c2"></div>
        <div class="candy c4"></div>
      </div>
      <h1>Dorin Kraš</h1>
      <p class="sub">Dora Explora 🛶</p>

      <div class="label">Do Dorinega rojstnega dne</div>
      <div class="countdown">
        <div class="unit"><span class="num" id="d">0</span><small>dni</small></div>
        <div class="unit"><span class="num" id="h">00</span><small>ur</small></div>
        <div class="unit"><span class="num" id="m">00</span><small>minut</small></div>
        <div class="unit"><span class="num" id="s">00</span><small>sekund</small></div>
      </div>
      <div class="bar"><div id="bar"></div></div>
      <div class="party">Vse najboljše, Dora! 🎉</div>

      <button id="play">Igraj</button>
    </main>
  </section>

  <!-- Zemljevid ob Grosupeljščici -->
  <section class="zaslon" id="zaslon-zemljevid">
    <header class="vrstica">
      <button class="majhen" id="nazaj-vstop" aria-label="Nazaj">‹</button>
      <div class="naslov-zemljevida">Dorin Kraš</div>
      <button class="zivljenja" id="zivljenja" aria-label="Življenja"></button>
    </header>
    <button class="majhen zvok" id="zvok" aria-label="Zvok">🔊</button>
    <div class="svet3d" id="svet3d" hidden>
      <div class="oblaki"><span></span><span></span><span></span><span></span></div>
    </div>
    <div class="zemljevid-ovoj" id="zemljevid-ovoj">
      <div class="zemljevid" id="zemljevid"></div>
    </div>
  </section>

  <!-- Igra -->
  <section class="zaslon" id="zaslon-igra">
    <div class="voda-ozadje"></div>
    <header class="vrstica igra-vrstica">
      <button class="majhen" id="nazaj-zemljevid" aria-label="Na zemljevid">‹</button>
      <div class="hud">
        <div class="hud-poteze"><b id="hud-poteze">0</b><small>potez</small></div>
        <div class="hud-sredina">
          <div class="napredek">
            <div class="napredek-polnilo" id="napredek-polnilo"></div>
            <span class="napredek-zvezda">★</span><span class="napredek-zvezda">★</span><span class="napredek-zvezda">★</span>
          </div>
          <div class="hud-cilj">Stopnja <span id="hud-stopnja">1</span> · cilj <span id="hud-cilj">0</span></div>
        </div>
        <div class="hud-tocke"><b id="hud-tocke">0</b><small>točk</small></div>
      </div>
    </header>
    <div class="plosca-ovoj" id="plosca-ovoj">
      <div class="plosca" id="plosca"></div>
    </div>
    <p class="navodilo">Potegni element na sosednje polje. Štirje v vrsto pokličejo Doro ⚡</p>
  </section>

  <!-- Zaslon zmage -->
  <div class="zmaga" id="zmaga">
    <div class="konfeti" id="konfeti"></div>
    <h2 class="zmaga-naslov">Stopnja opravljena!</h2>
    <p class="zmaga-pod" id="zmaga-pod"></p>
    <div class="zmaga-zvezdice" id="zmaga-zvezdice"><span>★</span><span>★</span><span>★</span></div>
    <div class="zmaga-tocke" id="zmaga-tocke"></div>
    <div class="zmaga-gumbi">
      <button id="zmaga-naprej">Naprej</button>
      <button class="drugotni" id="zmaga-ponovi">Ponovi</button>
    </div>
    <div class="zmaga-lik" id="zmaga-lik"></div>
  </div>

  <!-- Okno (pred stopnjo, poraz, sporočila) -->
  <div class="okno" id="okno">
    <div class="okno-kartica">
      <button class="okno-zapri" id="okno-zapri" aria-label="Zapri">✕</button>
      <h2 id="okno-naslov"></h2>
      <div class="okno-zvezdice" id="okno-zvezdice"></div>
      <p id="okno-besedilo"></p>
      <div class="okno-gumbi" id="okno-gumbi"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="js/nastavitve.js?v=15"></script>
  <script src="js/zvok.js?v=15"></script>
  <script src="js/plosca.js?v=15"></script>
  <script src="js/svet3d.js?v=15"></script>
  <script src="js/aplikacija.js?v=15"></script>
</body>
</html>
